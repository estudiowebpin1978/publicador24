<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="85" fill="#0a0a14" stroke="url(#violetGrad)" stroke-width="3"/>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>

  <!-- Main icon: Sparkle / AI -->
  <g filter="url(#glow)">
    <!-- Central diamond -->
    <polygon points="100,40 140,100 100,160 60,100" fill="url(#violetGrad)" stroke="white" stroke-width="2"/>
    
    <!-- Spark lines -->
    <line x1="100" y1="25" x2="100" y2="55" stroke="url(#violetGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="100" x2="125" y2="100" stroke="url(#violetGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="145" x2="100" y2="175" stroke="url(#violetGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="75" y2="100" stroke="url(#violetGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Corner sparks -->
    <circle cx="100" cy="25" r="4" fill="#DB2777"/>
    <circle cx="155" cy="100" r="4" fill="#DB2777"/>
    <circle cx="100" cy="175" r="4" fill="#DB2777"/>
    <circle cx="45" cy="100" r="4" fill="#DB2777"/>
  </g>

  <!-- Text -->
  <text x="100" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="white" letter-spacing="6">EW</text>
</svg>
